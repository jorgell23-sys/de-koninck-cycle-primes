<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="100%" role="img" aria-label="ciclo de 631">
<style>
  svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .ink { fill: #1d2433; } .soft { fill: #5b6478; } .line { stroke: #1d2433; }
  .accent { fill: #2f6fdd; } .accentline { stroke: #2f6fdd; }
  .warm { fill: #c2541b; } .warmline { stroke: #c2541b; }
  .box { fill: #eef2fa; stroke: #9aa7c2; } .grid { stroke: #d5dbe7; }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #e7ebf3; } .soft { fill: #a8b1c4; } .line { stroke: #e7ebf3; }
    .accent { fill: #7aa7ff; } .accentline { stroke: #7aa7ff; }
    .warm { fill: #ff9a5c; } .warmline { stroke: #ff9a5c; }
    .box { fill: #1f2940; stroke: #4a587a; } .grid { stroke: #2e3850; }
  }
</style>
<circle cx="340" cy="70" r="38" class="box" stroke-width="2"/>
<text x="340.0" y="77.0" class="ink" font-size="22" text-anchor="middle" font-weight="bold">631</text>
<circle cx="560" cy="300" r="38" class="box" stroke-width="2"/>
<text x="560.0" y="307.0" class="ink" font-size="22" text-anchor="middle" font-weight="bold">79</text>
<circle cx="120" cy="300" r="38" class="box" stroke-width="2"/>
<text x="120.0" y="307.0" class="ink" font-size="22" text-anchor="middle" font-weight="bold">43</text>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker></defs>
<line x1="370.4" y1="101.8" x2="528.2" y2="266.8" class="accentline" stroke-width="2.5" marker-end="url(#h)"/>
<text x="520.0" y="167.0" class="soft" font-size="14" text-anchor="middle" font-weight="normal">631 + 1 = 2³ · 79</text>
<line x1="516.0" y1="300.0" x2="166.0" y2="300.0" class="accentline" stroke-width="2.5" marker-end="url(#h)"/>
<text x="340.0" y="344.0" class="soft" font-size="14" text-anchor="middle" font-weight="normal">79² + 79 + 1 = 3 · 7² · 43</text>
<line x1="150.4" y1="268.2" x2="308.2" y2="103.2" class="accentline" stroke-width="2.5" marker-end="url(#h)"/>
<text x="160.0" y="167.0" class="soft" font-size="14" text-anchor="middle" font-weight="normal">43² + 43 + 1 = 3 · 631</text>
<text x="340.0" y="390.0" class="soft" font-size="13" text-anchor="middle" font-weight="normal">Cada flecha: el número de la izquierda de la cuenta es divisible por el primo al que llega.</text>
</svg>
